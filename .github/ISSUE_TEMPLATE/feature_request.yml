name: "기능 제안"
description: "이음에서 하고 싶은 작업이나 개선할 점을 알려 주세요."
title: "[제안] "
body:
  - type: textarea
    id: situation
    attributes:
      label: "어떤 작업을 하다가 필요했나요?"
      description: "현재 불편한 점과 사용 상황을 알려 주세요."
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: "어떻게 바뀌면 좋을까요?"
      description: "원하는 동작이나 짧은 사용 예시를 적어 주세요."
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: "지금은 어떤 방법을 쓰고 있나요?"
      description: "대신 사용하는 방법이 있다면 알려 주세요."
